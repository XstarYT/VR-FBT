<script type="module">

const bones={};model.traverse(o=>{if(o.isBone)bones[o.name]=o;});
const positions=[[-2.0,1.35,-3],[2.0,1.35,-3],new URLSearchParams(location.search).get('rig')==='front'?[0,1.5,-3.5]:[3.2,1.35,.3]];

 mixer.stopAllAction(); const action=actions[phase]||actions[Object.keys(actions)[0]];
